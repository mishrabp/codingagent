[project]
name = "pm-backend"
version = "0.1.0"
description = "Kanban backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
